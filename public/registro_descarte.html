<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Descarte por Usuário</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select, input[type="date"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #loading { color: #007bff; font-weight: bold; }
        #message { margin-top: 20px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <form id="registroDescarteForm">
        <h2>Registro de Descarte</h2>

        <div>
            <label for="nomeUsuario">Nome do Usuário:</label>
            <input type="text" id="nomeUsuario" name="nomeUsuario" required>
        </div>

        <div>
            <label for="id_pontoDescarte">Ponto de Descarte:</label>
            <select id="id_pontoDescarte" name="id_pontoDescarte" required>
                <option value="">Carregando pontos de descarte...</option>
            </select>
            <p id="loading"></p>
        </div>

        <div>
            <label for="tipoResiduo">Tipo de Resíduo:</label>
            <select id="tipoResiduo" name="tipoResiduo" required>
                <option value="">Selecione o tipo de resíduo</option>
                <option value="plástico">Plástico</option>
                <option value="papel">Papel</option>
                <option value="orgânico">Orgânico</option>
                <option value="eletrônico">Eletrônico</option>
                <option value="vidro">Vidro</option>
                <option value="outros">Outros</option>
            </select>
        </div>

        <div>
            <label for="data">Data do Descarte:</label>
            <input type="date" id="data" name="data" required>
        </div>
        
        <button type="submit">Registrar Descarte</button>
    </form>
    
    <div id="message"></div>

    <script src="registro_descarte.js"></script>
</body>
</html>
