<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Ponto de Descarte</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #message { margin-top: 20px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <form id="pontoDescarteForm">
        <h2>Cadastro de Novo Ponto de Descarte</h2>

        <div>
            <label for="nomeLocal">Nome do Local:</label>
            <input type="text" id="nomeLocal" name="nomeLocal" required>
        </div>

        <div>
            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro" required>
        </div>

        <div>
            <label for="tipoLocal">Tipo de Local:</label>
            <select id="tipoLocal" name="tipoLocal" required>
                <option value="publico">Público</option>
                <option value="privado">Privado</option>
            </select>
        </div>

        <div>
            <label for="categoriaResiduos">Categorias de Resíduos Aceitos (Ex: Papel, Vidro, Plástico):</label>
            <input type="text" id="categoriaResiduos" name="categoriaResiduos" required>
        </div>

        <div>
            <label for="geolocalizacaoLat">Latitude:</label>
            <input type="text" id="geolocalizacaoLat" name="geolocalizacaoLat" placeholder="-23.99" required>
        </div>
        <div>
            <label for="geolocalizacaoLon">Longitude:</label>
            <input type="text" id="geolocalizacaoLon" name="geolocalizacaoLon" placeholder="-46.66" required>
        </div>
        
        <button type="submit">Cadastrar Ponto</button>
    </form>
    
    <div id="message"></div>

    <script src="cadastro_ponto.js"></script>
</body>
</html>
